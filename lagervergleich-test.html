<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Zwei interaktive HH-Selbsttests zu Eigenlager, Fremdlager und kritischer Lagermenge."><meta name="theme-color" content="#173d5b"><title>Eigenlager oder Fremdlager · MG Büromöbel AG</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#183247;background:#eff4f7;--navy:#173d5b;--blue:#176b9c;--line:#d9e4ea;--muted:#526a7b}*{box-sizing:border-box}body{margin:0;line-height:1.55}header{background:linear-gradient(120deg,#173d5b,#226d91);color:white;padding:30px 18px 34px}.hero,main{max-width:920px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:#c5e4ed;font-size:.8rem;font-weight:700}.hero h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:8px 0}.hero p{margin:0;color:#e2eff5}.badge{display:inline-block;margin-top:14px;border:1px solid #a9cbd8;border-radius:99px;padding:4px 11px;font-size:.88rem}main{padding:22px 16px 45px}.panel,.question,.topic{background:#fff;border:1px solid #e0e8ed;border-radius:15px;padding:19px;margin:15px 0;box-shadow:0 5px 20px #17384c0a}.topic h2,.question h2{color:var(--navy);margin:0;font-size:1.08rem}.topic p{color:var(--muted)}.qtop{display:flex;gap:10px;align-items:flex-start}.qnum{background:#e8f2f8;color:#15577d;border-radius:99px;padding:2px 9px;font-weight:800;white-space:nowrap}.points{margin-left:auto;color:var(--muted);font-size:.9rem;white-space:nowrap}.choice{display:block;margin:7px 0;font-weight:400!important}.choice input{accent-color:var(--blue);margin-right:8px}.answer{font:inherit;width:100%;padding:9px 10px;border:1px solid #aebfca;border-radius:7px;background:#fff;color:#183247}.feedback{font-weight:650;margin-top:10px;min-height:1.4em}.good{color:#137347}.bad{color:#9d3024}.actions{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;background:var(--blue);color:white;border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}.secondary{background:#627c8e}.result{background:#edf6f1;border-left:5px solid #27865b;padding:15px;border-radius:8px;margin-top:12px}.result strong{font-size:1.12rem}details{margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:9px}summary{cursor:pointer;font-weight:700;color:var(--navy)}table{border-collapse:collapse;width:100%;font-size:.92rem;margin-top:10px}th,td{border:1px solid #d9e4ea;text-align:left;padding:7px}th{background:#edf3f7}.small{font-size:.9rem;color:var(--muted)}footer{text-align:center;color:#617789;padding:4px 16px 25px}a{color:#15577d}@media(max-width:520px){header{padding:24px 15px}.panel,.question,.topic{padding:15px}main{padding-inline:12px}.points{font-size:.82rem}}
</style></head><body><header><div class="hero"><div class="eyebrow">Wirtschaft · Handlungsfeld 4 · Absatz · HH</div><h1 id="title">Selbsttests: Eigenlager oder Fremdlager</h1><p id="subtitle">Wähle einen Themenbereich und überprüfe dein Wissen.</p><span class="badge">Höhere Berufsfachschule · Selbstkontrolle · keine Anmeldung</span></div></header><main><section class="panel" id="chooser"></section><div id="tests"></div></main><footer>MG Büromöbel AG · Interaktives Unterrichtsmaterial · <a href="./index.html">Zur Startseite</a></footer><script>
const thresholds=[[0,6],[21,5.3],[29,5],[37,4.7],[45,4.3],[50,4],[55,3.7],[60,3.3],[64.5,3],[69,2.7],[73,2.3],[77.5,2],[82,1.7],[87,1.3],[91.5,1],[96,.7]];
const tests=[
{id:'kosten',title:'Test 1 · Lagerarten und Kostenvergleich',desc:'Eigenlager und Fremdlager unterscheiden, Kosten berechnen und die kritische Lagermenge finden.',qs:[
{type:'choice',p:1,q:'Welche Kosten fallen beim Eigenlager auch dann an, wenn es nur teilweise gefüllt ist?',a:['Miete, Abschreibungen und feste Gehälter','Nur Kosten je eingelagertem Kubikmeter','Ausschließlich Verpackungsmaterial'],k:0,e:'Miete, Abschreibungen und Gehälter sind fixe Kosten. Sie fallen unabhängig von der genauen Lagermenge an.'},
{type:'choice',p:1,q:'Wie berechnet sich der Lagerpreis beim Fremdlager laut Angebot?',a:['Fixkosten plus 3 € je m³','7 € je m³ multipliziert mit der Lagermenge','10.000 € plus 7 € je m³'],k:1,e:'Das Fremdlager berechnet 7,00 € je m³ und Monat. Gesamtkosten = Preis je m³ × Menge.'},
{type:'number',p:1,q:'Wie hoch sind die monatlichen fixen Kosten des Eigenlagers? Miete 4.200 €, Abschreibungen 1.300 €, Gehälter 4.500 €.',k:10000,tol:.01,unit:'€',e:'4.200 + 1.300 + 4.500 = 10.000 € fixe Kosten im Monat.'},
{type:'number',p:2,q:'Berechne die Eigenlagerkosten bei 2.000 m³. Fixkosten 10.000 €, variable Kosten 3 € je m³.',k:16000,tol:.01,unit:'€',e:'10.000 + 3 × 2.000 = 16.000 € im Monat.'},
{type:'number',p:2,q:'Berechne die Fremdlagerkosten bei 2.000 m³ und 7 € je m³.',k:14000,tol:.01,unit:'€',e:'7 × 2.000 = 14.000 € im Monat.'},
{type:'choice',p:1,q:'Welche Lagerart ist bei der aktuellen Prognose von 2.000 m³ monatlich günstiger?',a:['Eigenlager, um 2.000 €','Fremdlager, um 2.000 €','Beide gleich teuer'],k:1,e:'Eigenlager: 16.000 €. Fremdlager: 14.000 €. Das Fremdlager ist 2.000 € im Monat günstiger.'},
{type:'number',p:2,q:'Berechne die kritische Lagermenge: fixe Eigenlagerkosten 10.000 €, variable Eigenlagerkosten 3 € je m³, Fremdlagerpreis 7 € je m³.',k:2500,tol:.01,unit:'m³',e:'x = 10.000 : (7 − 3) = 2.500 m³. Bei dieser Menge kosten beide Lager 17.500 €.'},
{type:'choice',p:1,q:'Wann ist das Eigenlager nach dem Kostenvergleich günstiger?',a:['Unterhalb der kritischen Lagermenge','Bei jeder Menge gleich','Oberhalb der kritischen Lagermenge'],k:2,e:'Oberhalb der kritischen Lagermenge ist das Eigenlager günstiger, weil die variablen Kosten je m³ niedriger sind.'}
]},
{id:'vertrag',title:'Test 2 · Lagervertrag und begründete Entscheidung',desc:'Lagervertrag, Lagerschein, Haftung sowie Kosten und qualitative Entscheidungskriterien.',qs:[
{type:'choice',p:1,q:'Welche Hauptpflicht hat die Niersland Lagerlogistik GmbH als Lagerhalter?',a:['Die Ware zu lagern und aufzubewahren','Den Kaufpreis der Möbel zu bezahlen','Die Möbel an Endkunden zu verkaufen'],k:0,e:'Beim Lagervertrag verpflichtet sich der Lagerhalter, das Gut zu lagern und aufzubewahren. Der Einlagerer zahlt die vereinbarte Vergütung (§ 467 HGB).'},
{type:'choice',p:1,q:'Was bestätigt ein Lagerschein im Grundsatz?',a:['Dass der Lagerhalter die Ware erhalten hat','Dass die Ware verkauft wurde','Dass alle Lagerkosten für immer bezahlt sind'],k:0,e:'Ein Lagerschein dokumentiert insbesondere die Einlagerung und die Verpflichtung zur Auslieferung des Gutes.'},
{type:'choice',p:1,q:'Bei welcher erwarteten Menge sind Eigen- und Fremdlagerkosten gleich hoch?',a:['2.000 m³','2.500 m³','3.000 m³'],k:1,e:'Die kritische Lagermenge beträgt 2.500 m³. Dort kosten beide Varianten 17.500 € monatlich.'},
{type:'number',p:2,q:'Bei der kritischen Menge von 2.500 m³: Wie hoch sind die monatlichen Kosten jeder Lagerart?',k:17500,tol:.01,unit:'€',e:'Eigenlager: 10.000 + 3 × 2.500 = 17.500 €. Fremdlager: 7 × 2.500 = 17.500 €.'},
{type:'number',p:2,q:'Beim Ersatzteillager wurden fixe Kosten von 7.200 €, variable Kosten von 2,40 € je m³ und Fremdlagerkosten von 6 € je m³ ermittelt. Wie hoch ist die kritische Menge?',k:2000,tol:.01,unit:'m³',e:'x = 7.200 : (6,00 − 2,40) = 7.200 : 3,60 = 2.000 m³. Die beiden Preise werden voneinander abgezogen.'},
{type:'choice',p:2,q:'Die Prognose für Jahr 1 bis 3 lautet 2.000, 2.500 und 3.000 m³. Welche Aussage zu den Gesamtkosten über drei Jahre stimmt?',a:['Das Eigenlager kostet insgesamt 630.000 €, das Fremdlager 630.000 €.','Das Fremdlager ist insgesamt 60.000 € günstiger.','Das Eigenlager ist insgesamt 60.000 € günstiger.'],k:0,e:'Über 12 Monate je Jahr: Eigenlager 192.000 + 210.000 + 228.000 = 630.000 €. Fremdlager 168.000 + 210.000 + 252.000 = 630.000 €.'},
{type:'choice',p:1,q:'Bei 3.000 m³ im Monat: Welche Aussage stimmt?',a:['Fremdlager günstiger, weil es keine Fixkosten hat.','Eigenlager kostet 19.000 €, Fremdlager 21.000 €; Eigenlager ist um 2.000 € günstiger.','Beide Lager kosten jeweils 17.500 €.'],k:1,e:'Bei 3.000 m³ liegen die Kosten bei 19.000 € (Eigenlager) und 21.000 € (Fremdlager). Die Menge liegt über dem kritischen Wert.'},
{type:'choice',p:1,q:'Was spricht bei unsicherer oder stark schwankender Lagermenge besonders für das Fremdlager?',a:['Die geringere Bindung an fixe Kosten und eine flexiblere Anpassung an die Menge','Dass immer alle Waren direkt im eigenen Werk liegen','Dass der Eigenlager-Mietvertrag mindestens fünf Jahre läuft'],k:0,e:'Beim Fremdlager passen sich die Kosten stärker der gelagerten Menge an. Die kürzere Vertragslaufzeit und moderne Technik sind weitere mögliche Entscheidungskriterien.'}
]}
];
function grade(p){let n=6;for(const[t,g]of thresholds){if(p>=t)n=g;else break}return n.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})}
function render(){const id=new URLSearchParams(location.search).get('teil'),selected=id?tests.filter(t=>t.id===id):tests,box=document.querySelector('#chooser');if(id&&!selected.length){box.innerHTML='Dieser Test wurde nicht gefunden. <a href="./lagervergleich.html">Zur Themenübersicht</a>';return}box.innerHTML=id?'<a href="./lagervergleich.html">← Zur Themenübersicht</a><p>Prüfe jede Antwort einzeln. Falsche Antworten zeigen die richtige Lösung mit einer kurzen Erklärung. Die Gesamtauswertung erscheint, wenn alle Aufgaben geprüft sind.</p>':'<b>Wähle einen Test:</b><p>Die beiden Tests enthalten jeweils 8 Aufgaben mit Punkten, Lösungshinweisen und HH-Notenschlüssel. Deine Antworten werden nicht übertragen oder gespeichert.</p>';document.querySelector('#title').textContent=id?selected[0].title:'Selbsttests: Eigenlager oder Fremdlager';document.querySelector('#subtitle').textContent=id?selected[0].desc:'Zwei thematisch getrennte Tests zur Lernaufgabe „Zwischen Eigenlager und Fremdlager entscheiden“. ';if(!id){document.querySelector('#tests').innerHTML=selected.map(t=>`<section class="topic"><h2>${t.title}</h2><p>${t.desc}</p><a href="./lagervergleich-test.html?teil=${t.id}">Test öffnen →</a></section>`).join('');return}const t=selected[0],cards=t.qs.map((q,i)=>`<article class="question" id="q${i}"><div class="qtop"><span class="qnum">${i+1}</span><h2>${q.q}</h2><span class="points">${q.p} ${q.p===1?'Punkt':'Punkte'}</span></div>${q.type==='choice'?q.a.map((a,j)=>`<label class="choice"><input type="radio" name="a${i}" value="${j}"> ${a}</label>`).join(''):`<label class="choice">Deine Antwort <input class="answer" id="a${i}" type="number" step="0.01" inputmode="decimal" placeholder="Zahl eingeben"> ${q.unit}</label>`}<button type="button" onclick="check(${i})">Antwort prüfen</button><div class="feedback" id="f${i}" aria-live="polite"></div></article>`).join('');document.querySelector('#tests').innerHTML=cards+`<section class="panel"><h2>Gesamtauswertung</h2><div id="overall" class="result">Prüfe alle ${t.qs.length} Aufgaben, um dein Ergebnis zu sehen.</div><button class="secondary" type="button" onclick="location.reload()">Test neu starten</button><details><summary>HH-Notenschlüssel anzeigen</summary><table><thead><tr><th>Ab Prozent</th><th>Note</th></tr></thead><tbody>${thresholds.map(([p,g])=>`<tr><td>${String(p).replace('.',',')} %</td><td>${String(g.toFixed(1)).replace('.',',')}</td></tr>`).join('')}</tbody></table><p class="small">Es gilt die höchste erreichte Schwelle; Prozentwerte werden nicht vorher gerundet.</p></details></section><section class="panel small">Die Rechenaufgaben verwenden die Daten aus der Lernaufgabe. Bei einer echten Lagerentscheidung sind neben den Kosten auch Vertragsbedingungen, Risikoverteilung und betriebliche Anforderungen zu prüfen.</section>`}
function check(i){const t=tests.find(x=>x.id===new URLSearchParams(location.search).get('teil')),q=t.qs[i];let ok=false,answer='';if(q.type==='choice'){const v=document.querySelector(`input[name="a${i}"]:checked`);if(!v){document.querySelector('#f'+i).className='feedback bad';document.querySelector('#f'+i).textContent='Bitte wähle zuerst eine Antwort.';return}ok=Number(v.value)===q.k;answer=q.a[q.k]}else{const v=document.querySelector('#a'+i).value;if(v===''){document.querySelector('#f'+i).className='feedback bad';document.querySelector('#f'+i).textContent='Bitte gib zuerst einen Wert ein.';return}ok=Math.abs(Number(v.replace(',','.'))-q.k)<=q.tol;answer=q.k.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+q.unit}window.checked=window.checked||{};window.checked[i]=ok?q.p:0;const f=document.querySelector('#f'+i);f.className='feedback '+(ok?'good':'bad');f.textContent=ok?`Richtig! Du erhältst ${q.p} ${q.p===1?'Punkt.':'Punkte.'} ${q.e}`:`Noch nicht richtig. Lösung: ${answer}. ${q.e}`;update(t)}
function update(t){const done=Object.keys(window.checked||{}).length;if(done<t.qs.length){document.querySelector('#overall').textContent=`Bisher geprüft: ${done} von ${t.qs.length}. Prüfe noch die übrigen Aufgaben.`;return}const got=Object.values(window.checked).reduce((a,b)=>a+b,0),max=t.qs.reduce((a,q)=>a+q.p,0),pct=100*got/max;document.querySelector('#overall').innerHTML=`Ergebnis: <strong>${got} von ${max} Punkten (${pct.toLocaleString('de-DE',{maximumFractionDigits:1})} %)</strong><br>Selbstkontrollnote nach dem HH-Notenschlüssel: <strong>${grade(pct)}</strong>`}
render();</script></body></html>

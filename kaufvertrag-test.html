<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Drei interaktive HH-Selbsttests zum Abschluss von Kaufverträgen."><meta name="theme-color" content="#173d5b"><title>Kaufvertrag · Selbsttests · MG Büromöbel AG</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#183247;background:#eff4f7;--navy:#173d5b;--blue:#176b9c;--line:#d9e4ea;--muted:#526a7b}*{box-sizing:border-box}body{margin:0;line-height:1.55}header{background:linear-gradient(120deg,#173d5b,#226d91);color:white;padding:30px 18px 34px}.hero,main{max-width:920px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:#c5e4ed;font-size:.8rem;font-weight:700}.hero h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:8px 0}.hero p{margin:0;color:#e2eff5}.badge{display:inline-block;margin-top:14px;border:1px solid #a9cbd8;border-radius:99px;padding:4px 11px;font-size:.88rem}main{padding:22px 16px 45px}.panel,.question,.topic{background:#fff;border:1px solid #e0e8ed;border-radius:15px;padding:19px;margin:15px 0;box-shadow:0 5px 20px #17384c0a}.topic h2,.question h2{color:var(--navy);margin:0;font-size:1.08rem}.topic p{color:var(--muted)}.qtop{display:flex;gap:10px;align-items:flex-start}.qnum{background:#e8f2f8;color:#15577d;border-radius:99px;padding:2px 9px;font-weight:800;white-space:nowrap}.points{margin-left:auto;color:var(--muted);font-size:.9rem;white-space:nowrap}.choice{display:block;margin:7px 0;font-weight:400!important}.choice input{accent-color:var(--blue);margin-right:8px}.feedback{font-weight:650;margin-top:10px;min-height:1.4em}.good{color:#137347}.bad{color:#9d3024}.actions{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;background:var(--blue);color:white;border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}.secondary{background:#627c8e}.result{background:#edf6f1;border-left:5px solid #27865b;padding:15px;border-radius:8px;margin-top:12px}.result strong{font-size:1.12rem}details{margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:9px}summary{cursor:pointer;font-weight:700;color:var(--navy)}table{border-collapse:collapse;width:100%;font-size:.92rem;margin-top:10px}th,td{border:1px solid #d9e4ea;text-align:left;padding:7px}th{background:#edf3f7}.small{font-size:.9rem;color:var(--muted)}footer{text-align:center;color:#617789;padding:4px 16px 25px}a{color:#15577d}@media(max-width:520px){header{padding:24px 15px}.panel,.question,.topic{padding:15px}main{padding-inline:12px}.points{font-size:.82rem}}
</style></head><body><header><div class="hero"><div class="eyebrow">Wirtschaft · Handlungsfeld 4 · Absatz · HH</div><h1 id="title">Selbstlerntests: Kaufvertrag</h1><p id="subtitle">Wähle einen Themenbereich und überprüfe dein Wissen.</p><span class="badge">Höhere Berufsfachschule · Selbstkontrolle · keine Anmeldung</span></div></header><main><section class="panel" id="chooser"></section><div id="tests"></div></main><footer>MG Büromöbel AG · Interaktives Unterrichtsmaterial · <a href="./index.html">Zur Startseite</a></footer><script>
const thresholds=[[0,6],[21,5.3],[29,5],[37,4.7],[45,4.3],[50,4],[55,3.7],[60,3.3],[64.5,3],[69,2.7],[73,2.3],[77.5,2],[82,1.7],[87,1.3],[91.5,1],[96,.7]];
const tests=[
{id:'abschluss',title:'Test 1 · Vertragsschluss und Angebotsfristen',desc:'Antrag, Annahme, Verbindlichkeit, Freizeichnung und verspätete Annahme.',qs:[
{p:1,q:'Welche Voraussetzung braucht ein Kaufvertrag grundsätzlich?',a:['Zwei übereinstimmende Willenserklärungen','Eine Rechnung und eine Lieferung','Eine schriftliche Unterschrift beider Seiten'],k:0,e:'Ein Kaufvertrag kommt durch zwei übereinstimmende Willenserklärungen zustande: Antrag und Annahme.'},
{p:1,q:'Die MG Büromöbel AG schickt ein verbindliches Angebot. Die Kundin bestellt rechtzeitig und unverändert. Was ist die Bestellung?',a:['Annahme des Angebots','Ein neuer Antrag der Verkäuferin','Nur eine unverbindliche Anfrage'],k:0,e:'Bei einem verbindlichen Angebot ist die rechtzeitige, inhaltlich gleiche Bestellung die Annahme.'},
{p:1,q:'Die MG Büromöbel AG bietet 30 Stühle für 289 € je Stück an. Der Kunde bestellt zum Preis von 270 €. Was gilt?',a:['Der Kaufvertrag kommt über 270 € zustande.','Die Bestellung ist Ablehnung und zugleich ein neuer Antrag.','Der Kunde hat das Angebot unverändert angenommen.'],k:1,e:'Eine Annahme mit geändertem Preis weicht vom Angebot ab. Sie gilt als Ablehnung und neuer Antrag (§ 150 BGB).'},
{p:1,q:'Ein Online-Katalog zeigt einen Büroschrank. Der Kunde bestellt, und die MG Büromöbel AG liefert. Was ist der Katalog?',a:['Ein verbindliches Angebot','Eine Aufforderung, einen Antrag abzugeben','Die Annahme des Kunden'],k:1,e:'Kataloge und Websites sind grundsätzlich noch kein verbindliches Angebot. Die Lieferung kann die Bestellung des Kunden annehmen.'},
{p:2,q:'Eine Bestellung geht drei Wochen nach einem E-Mail-Angebot ohne Frist ein. Was gilt laut Lernaufgabe?',a:['Sie ist stets eine wirksame Annahme.','Sie ist verspätet und gilt als neuer Antrag.','Der Vertrag gilt schon durch Schweigen.'],k:1,e:'Eine Annahme per E-Mail muss in kurzer Zeit eingehen. Eine verspätete Annahme gilt als neuer Antrag (§ 150 BGB).'},
{p:1,q:'Ein verbindliches Angebot wird am Telefon gemacht. Bis wann muss es angenommen werden?',a:['Sofort im Gespräch','Innerhalb einer Woche','Innerhalb von 30 Tagen'],k:0,e:'Ein Antrag unter Anwesenden, auch am Telefon, kann grundsätzlich nur sofort angenommen werden (§ 147 BGB).'},
{p:2,q:'Das Angebot an Rheinblick ist bis 31.10. gültig. Die Kundin bestellt am 14.10. unverändert. Wann kommt der Vertrag zustande?',a:['Am 06.10. mit dem Versand des Angebots','Am 14.10. mit Zugang der unveränderten Bestellung','Erst am 15.10. mit der Auftragsbestätigung'],k:1,e:'Die rechtzeitige, unveränderte Bestellung nimmt das Angebot am 14.10. an. Eine zusätzliche Auftragsbestätigung ist dafür nicht nötig.'},
{p:1,q:'Wann muss ein Widerruf des Angebots spätestens beim Kunden ankommen?',a:['Nach der Bestellung','Vor oder gleichzeitig mit dem Angebot','Innerhalb von zwei Wochen'],k:1,e:'Der Widerruf muss dem Empfänger vor oder gleichzeitig mit dem Angebot zugehen (§ 130 BGB).'}
]},
{id:'pflichten',title:'Test 2 · Pflichten, Erfüllung und Eigentum',desc:'Pflichten von Verkäufer und Käufer, Verpflichtungs- und Erfüllungsgeschäft, Besitz und Eigentum.',qs:[
{p:1,q:'Welche Pflichten hat die Verkäuferin aus dem Kaufvertrag?',a:['Ware übergeben und Eigentum verschaffen','Nur die Rechnung schreiben','Kaufpreis zahlen und Ware abnehmen'],k:0,e:'Die Verkäuferin muss die Ware übergeben und dem Käufer das Eigentum daran verschaffen (§ 433 BGB).'},
{p:1,q:'Welche Pflichten hat der Käufer aus dem Kaufvertrag?',a:['Ware herstellen und liefern','Kaufpreis zahlen und die Ware abnehmen','Eigentumsvorbehalt erklären'],k:1,e:'Der Käufer muss den vereinbarten Kaufpreis zahlen und die gekaufte Sache abnehmen (§ 433 BGB).'},
{p:1,q:'Was bezeichnet das Verpflichtungsgeschäft?',a:['Die Vereinbarung, die Pflichten begründet','Die spätere Überweisung allein','Die Übergabe der Ware allein'],k:0,e:'Der Kaufvertrag verpflichtet beide Seiten. Die spätere Ausführung der Pflichten ist das Erfüllungsgeschäft.'},
{p:1,q:'Die Rheinblick Immobilien GmbH hat Schreibtische bereits erhalten, aber noch nicht bezahlt. Wer ist Besitzer?',a:['Die Rheinblick Immobilien GmbH, weil sie die Tische tatsächlich hat','Die MG Büromöbel AG, weil sie noch nicht bezahlt wurde','Die Spedition'],k:0,e:'Besitzer ist, wer die Sache tatsächlich innehat. Die Kundin hat die Tische erhalten.'},
{p:2,q:'Die Schreibtische wurden unter Eigentumsvorbehalt geliefert und sind noch nicht bezahlt. Wem gehören sie rechtlich?',a:['Der Rheinblick Immobilien GmbH','Weiterhin der MG Büromöbel AG','Der Spedition'],k:1,e:'Beim Eigentumsvorbehalt bleibt die Verkäuferin bis zur vollständigen Zahlung Eigentümerin; die Kundin ist bereits Besitzerin.'},
{p:1,q:'Was ist für den Eigentumsübergang an einer beweglichen Sache grundsätzlich nötig?',a:['Übergabe und Einigung über den Eigentumsübergang','Nur das Absenden der Rechnung','Die Eintragung in ein Register'],k:0,e:'Bei beweglichen Sachen geht das Eigentum grundsätzlich durch Übergabe und Einigung über den Eigentumsübergang über.'},
{p:1,q:'Die Verkäuferin bringt die 25 Schreibtische am 04.11. zur Kundin und diese nimmt sie entgegen. Was ist das?',a:['Verpflichtungsgeschäft','Erfüllung der Lieferpflicht','Ein neuer Antrag'],k:1,e:'Mit der Übergabe der Schreibtische erfüllt die Verkäuferin ihre Lieferpflicht.'},
{p:2,q:'Die Rheinblick GmbH bestellt die angebotenen Schreibtische und verpflichtet sich damit zur Zahlung. Was ist diese Erklärung?',a:['Erfüllung der Zahlungspflicht','Begründung einer Pflicht durch den Vertragsschluss','Eigentumsübergang'],k:1,e:'Die Bestellung nimmt das Angebot an und begründet die vertragliche Zahlungspflicht. Die Zahlung selbst erfüllt diese Pflicht später.'}
]},
{id:'gefahr',title:'Test 3 · Erfüllungsort, Gefahr und Gerichtsstand',desc:'Leistungsorte, Versendungskauf, Transportkosten, Fälligkeit und zuständiges Gericht.',qs:[
{p:1,q:'Wenn nichts anderes vereinbart ist: Wo liegt der Erfüllungsort für die Lieferung einer Ware?',a:['Am Sitz der Verkäuferin, hier Mönchengladbach','Am Wohnort der Käuferin','Am Sitz der Spedition'],k:0,e:'Bei der Warenschuld ist die Verkäuferin Schuldnerin. Ohne andere Vereinbarung liegt der Leistungsort grundsätzlich an ihrem Geschäftssitz (§ 269 BGB).'},
{p:1,q:'Wo liegt grundsätzlich der Erfüllungsort einer Geldschuld, wenn nichts anderes vereinbart ist?',a:['Am Sitz des Käufers als Schuldner','Am Sitz des Verkäufers','Beim Amtsgericht'],k:0,e:'Bei der Geldschuld ist der Käufer Schuldner. Für die Lernaufgabe wird der Sitz des Schuldners als Erfüllungsort verwendet; das Geld muss der Käufer auf eigene Kosten und Gefahr übermitteln.'},
{p:2,q:'Ein Unternehmen bittet um Versand. Die Ware wird einer Spedition übergeben und unterwegs zufällig beschädigt. Wer trägt nach der Lernaufgabe die Gefahr?',a:['Der Käufer, ab Übergabe an die Spedition','Die Verkäuferin bis zur Ankunft beim Käufer','Die Spedition trägt immer den Kaufpreisschaden'],k:0,e:'Beim Versendungskauf zwischen Unternehmen geht die Gefahr grundsätzlich mit Übergabe an die Transportperson auf den Käufer über (§ 447 BGB).'},
{p:1,q:'Die MG Büromöbel AG liefert mit dem eigenen Lkw. Die Ware geht unterwegs ohne Verschulden verloren. Wer trägt die Gefahr?',a:['Der Käufer ab Abfahrt','Die Verkäuferin bis zur Übergabe beim Käufer','Der Paketdienst'],k:1,e:'Der eigene Lkw der Verkäuferin ist keine Übergabe an eine selbstständige Transportperson. Die Gefahr bleibt bis zur Übergabe beim Käufer bei der Verkäuferin.'},
{p:2,q:'Im Vertrag steht „frei Haus“. Was wird damit laut Lernaufgabe geregelt?',a:['Wer die Transportkosten zahlt, nicht aber automatisch die Gefahr','Dass der Käufer niemals zahlen muss','Dass das Eigentum schon beim Versand übergeht'],k:0,e:'„Frei Haus“ betrifft die Transportkosten. Die Regel ändert für sich genommen nicht den Zeitpunkt des Gefahrübergangs.'},
{p:2,q:'Ein Privatkunde bestellt einen Stuhl für zu Hause. Der Paketdienst verliert das Paket. Wer trägt die Gefahr?',a:['Der Verbraucher ab Übergabe an den Paketdienst','Die Verkäuferin bis zum Erhalt durch den Verbraucher','Der Verbraucher, sobald die Rechnung erstellt wurde'],k:1,e:'Beim Verbrauchsgüterkauf geht die Gefahr grundsätzlich erst mit Erhalt der Ware durch den Verbraucher über (§ 475 BGB).'},
{p:2,q:'Eine Rechnung an ein Unternehmen ist am 16.12. fällig. Die Überweisung wird an diesem Tag beauftragt, das Geld kommt am 17.12. an. Ist rechtzeitig gezahlt?',a:['Ja, bei Unternehmen genügt immer der Überweisungsauftrag.','Nein, das Geld muss am Fälligkeitstag beim Verkäufer eingegangen sein.','Ja, solange der Käufer innerhalb einer Woche überweist.'],k:1,e:'Laut Lernaufgabe muss bei Unternehmen die Zahlung am Fälligkeitstag auf dem Konto des Verkäufers sein. Für Verbraucher reicht meist ein rechtzeitiger Überweisungsauftrag.'},
{p:2,q:'Ein Unternehmen schuldet 4.200 €. Es ist „Gerichtsstand Mönchengladbach“ vereinbart. Welches Gericht ist laut Lernaufgabe bei diesem Streitwert zuständig?',a:['Amtsgericht Mönchengladbach','Landgericht Bielefeld','Amtsgericht am Sitz der Spedition'],k:0,e:'Bei wirksamer Gerichtsstandsvereinbarung zwischen Kaufleuten ist Mönchengladbach zuständig. Bei 4.200 € liegt der Streitwert unter der aktuellen 10.000-€-Grenze für die Zuständigkeit der Amtsgerichte.'}
]}
];
function grade(p){let n=6;for(const[t,g]of thresholds){if(p>=t)n=g;else break}return n.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})}
function render(){const id=new URLSearchParams(location.search).get('teil'),selected=id?tests.filter(t=>t.id===id):tests,box=document.querySelector('#chooser');if(id&&!selected.length){box.innerHTML='Dieser Test wurde nicht gefunden. <a href="./kaufvertrag.html">Zur Themenübersicht</a>';return}box.innerHTML=id?'<a href="./kaufvertrag.html">← Zur Themenübersicht</a><p>Prüfe jede Antwort einzeln. Falsche Antworten zeigen Lösung und Erklärung. Die Gesamtauswertung erscheint, wenn alle Aufgaben geprüft sind.</p>':'<b>Wähle einen Test:</b><p>Die Tests enthalten jeweils 8 Aufgaben mit Punkten, Lösungshinweisen und HH-Notenschlüssel. Deine Antworten werden nicht übertragen oder gespeichert.</p>';document.querySelector('#title').textContent=id?selected[0].title:'Selbstlerntests: Kaufvertrag';document.querySelector('#subtitle').textContent=id?selected[0].desc:'Drei thematisch getrennte Tests zur Lernaufgabe „Einen Kaufvertrag abschließen“.';if(!id){document.querySelector('#tests').innerHTML=selected.map(t=>`<section class="topic"><h2>${t.title}</h2><p>${t.desc}</p><a href="./kaufvertrag-test.html?teil=${t.id}">Test öffnen →</a></section>`).join('');return}const t=selected[0];const cards=t.qs.map((q,i)=>`<article class="question" id="q${i}"><div class="qtop"><span class="qnum">${i+1}</span><h2>${q.q}</h2><span class="points">${q.p} ${q.p===1?'Punkt':'Punkte'}</span></div>${q.a.map((a,j)=>`<label class="choice"><input type="radio" name="a${i}" value="${j}"> ${a}</label>`).join('')}<button type="button" onclick="check(${i})">Antwort prüfen</button><div class="feedback" id="f${i}" aria-live="polite"></div></article>`).join('');document.querySelector('#tests').innerHTML=cards+`<section class="panel"><h2>Gesamtauswertung</h2><div id="overall" class="result">Prüfe alle ${t.qs.length} Aufgaben, um dein Ergebnis zu sehen.</div><button class="secondary" type="button" onclick="location.reload()">Test neu starten</button><details><summary>HH-Notenschlüssel anzeigen</summary><table><thead><tr><th>Ab Prozent</th><th>Note</th></tr></thead><tbody>${thresholds.map(([p,g])=>`<tr><td>${String(p).replace('.',',')} %</td><td>${String(g.toFixed(1)).replace('.',',')}</td></tr>`).join('')}</tbody></table><p class="small">Es gilt die höchste erreichte Schwelle; Prozentwerte werden nicht vorher gerundet.</p></details></section><section class="panel small">Die Aufgaben folgen der Lernaufgabe. Bei Rechtsfragen im konkreten Einzelfall können zusätzliche Vertragsdetails eine Rolle spielen. Zuständigkeitsfrage zum Streitwert gemäß aktuellem § 23 GVG.</section>`}
function check(i){const t=tests.find(x=>x.id===new URLSearchParams(location.search).get('teil')),q=t.qs[i],v=document.querySelector(`input[name="a${i}"]:checked`);if(!v){const f=document.querySelector('#f'+i);f.className='feedback bad';f.textContent='Bitte wähle zuerst eine Antwort.';return}const ok=Number(v.value)===q.k;window.checked=window.checked||{};window.checked[i]=ok?q.p:0;const f=document.querySelector('#f'+i);f.className='feedback '+(ok?'good':'bad');f.textContent=ok?`Richtig! Du erhältst ${q.p} ${q.p===1?'Punkt.':'Punkte.'} ${q.e}`:`Noch nicht richtig. Lösung: ${q.a[q.k]}. ${q.e}`;update(t)}
function update(t){if(Object.keys(window.checked||{}).length<t.qs.length){document.querySelector('#overall').textContent=`Bisher geprüft: ${Object.keys(window.checked||{}).length} von ${t.qs.length}. Prüfe noch die übrigen Aufgaben.`;return}const got=Object.values(window.checked).reduce((a,b)=>a+b,0),max=t.qs.reduce((a,q)=>a+q.p,0),pct=100*got/max;document.querySelector('#overall').innerHTML=`Ergebnis: <strong>${got} von ${max} Punkten (${pct.toLocaleString('de-DE',{maximumFractionDigits:1})} %)</strong><br>Selbstkontrollnote nach dem HH-Notenschlüssel: <strong>${grade(pct)}</strong>`}
render();</script></body></html>
